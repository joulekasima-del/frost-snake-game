<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#061827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Frost Snake">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Frost Snake</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <header class="hud">
        <div>
          <p class="eyebrow">Arcade prototype</p>
          <h1 id="game-title">Frost Snake</h1>
        </div>

        <dl class="stats" aria-live="polite">
          <div>
            <dt>Level</dt>
            <dd id="levelValue">1</dd>
          </div>
          <div>
            <dt>Score</dt>
            <dd id="scoreValue">000</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="bestValue">000</dd>
          </div>
        </dl>
      </header>

      <section class="board-card" aria-label="Frost Snake play area">
        <div class="board-header">
          <span>Frost snake</span>
          <span id="statusText">Ready</span>
        </div>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="840" height="840" aria-label="Frost Snake game board"></canvas>
          <div class="overlay" id="gameOverlay">
            <div>
              <p id="overlayKicker">Ready</p>
              <h2 id="overlayTitle">Guide the frost snake.</h2>
              <p id="overlayText">Eat the glowing frost orbs, avoid the wall, blue ice blocks, and your own trail.</p>
              <button class="primary-button" type="button" id="startButton">Start game</button>
            </div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Game controls">
        <div class="action-row">
          <button type="button" id="pauseButton">Pause</button>
          <button type="button" id="restartButton">Restart</button>
        </div>

        <div class="slide-pad" id="slidePad" role="group" tabindex="0" aria-label="Slide directional control. Swipe up, down, left, or right to steer.">
          <span class="slide-label" aria-hidden="true">SLIDE TO STEER</span>
          <span class="slide-arrow slide-arrow-up" data-slide-dir="up" aria-hidden="true">&uarr;</span>
          <span class="slide-arrow slide-arrow-left" data-slide-dir="left" aria-hidden="true">&larr;</span>
          <span class="slide-arrow slide-arrow-down" data-slide-dir="down" aria-hidden="true">&darr;</span>
          <span class="slide-arrow slide-arrow-right" data-slide-dir="right" aria-hidden="true">&rarr;</span>
          <span class="slide-puck" aria-hidden="true"></span>
        </div>

        <p class="control-note">Desktop: arrow keys or WASD. Mobile: swipe on the board or use the Slide Pad.</p>
      </section>
    </main>
  </body>
</html>
