<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#061827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Frost Snake">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Frost Snake</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <header class="hud">
        <div>
          <p class="eyebrow">Arcade prototype</p>
          <h1 id="game-title">Frost Snake</h1>
        </div>

        <dl class="stats" aria-live="polite">
          <div>
            <dt>Level</dt>
            <dd id="levelValue">1</dd>
          </div>
          <div>
            <dt>Score</dt>
            <dd id="scoreValue">000</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="bestValue">000</dd>
          </div>
        </dl>
      </header>

      <section class="board-card" aria-label="Frost Snake play area">
        <div class="board-header">
          <span>Frost snake</span>
          <span id="statusText">Ready</span>
        </div>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="840" height="840" aria-label="Frost Snake game board"></canvas>
          <div class="overlay" id="gameOverlay">
            <div>
              <p id="overlayKicker">Ready</p>
              <h2 id="overlayTitle">Guide the frost snake.</h2>
              <p id="overlayText">Eat the glowing frost orbs, avoid the wall, blue ice blocks, and your own trail.</p>
              <button class="primary-button" type="button" id="startButton">Start game</button>
            </div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Game controls">
        <div class="action-row">
          <button type="button" id="pauseButton">Pause</button>
          <button type="button" id="restartButton">Restart</button>
        </div>

        <div class="touch-zone" id="touchZone" role="group" tabindex="0" aria-label="Touch steering zone. Slide up, down, left, or right to steer.">
          <div class="touch-sign" aria-hidden="true">
            <svg viewBox="0 0 72 72" focusable="false">
              <path d="M36 12v8M36 52v8M12 36h8M52 36h8" />
              <path d="M25 44c0-5 3-8 7-8h2V22c0-3 2-5 5-5s5 2 5 5v18l5 2c4 2 6 6 5 11l-1 5H30l-4-9c-1-2-1-4-1-5Z" />
              <path d="M28 30c-3 2-5 5-5 9M46 30c3 2 5 5 5 9" />
            </svg>
            <span>Slide anywhere to steer</span>
          </div>
        </div>

        <p class="control-note">Desktop: arrow keys or WASD. Mobile: swipe on the board or use the touch zone.</p>
      </section>
    </main>
  </body>
</html>
